              description: ""
              required: true
              schema:
                type: string
            - name: year
              in: query
              description: ""
              required: true
              schema:
                type: integer
                format: int32
            - name: month
              in: query
              description: ""
              required: true
              schema:
                type: integer
                format: int32
            - name: day
              in: query
              description: ""
              required: true
              schema:
                type: integer
                format: int32
          responses:
            "200":
              description: OK
              content:
                text/csv:
                  schema:
                    type: string
                    format: binary
