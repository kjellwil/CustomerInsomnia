spec:
  contents:
    openapi: 3.0.4
    info:
      title: Lyse.SM24.Customer
      version: "1.0"
    paths:
      /api/accounts:
        get:
          tags:
            - Account
          summary: Get accounts
          description: Get accounts for an authenticated user.
          operationId: GetAccounts
          responses:
            "200":
              description: OK
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/AccountsModel"
      /api/consumption/electricity:
        get:
          tags:
            - Consumption
          summary: Get electricity consumption
          description: Get electricity consumption for a customer and metering point.
          operationId: GetElectricityConsumption
          parameters:
            - name: x-customerId
              in: header
              description: ""
              required: true
              schema:
                type: integer
                format: int64
            - name: meteringPointId
              in: query
              description: ""
              required: true
              schema:
                type: string
            - name: fromDate
              in: query
              description: "Format ISO-8601: YYYY-MM-DD"
              required: true
              schema:
                type: string
            - name: toDate
              in: query
              description: "Format ISO-8601: YYYY-MM-DD"
              required: true
              schema:
                type: string
            - name: resolution
              in: query
              description: "Supported resolutions: HOURLY, DAILY, WEEKLY, MONTHLY, YEARLY"
              required: true
              schema:
                type: string
          responses:
            "200":
              description: OK
              content:
                application/json:
                  schema:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConsumptionModel"
      /api/consumption/electricity/hourly:
        get:
          tags:
            - Consumption
          summary: Get hourly electricity consumption
          description: Get hourly electricity consumption for a customer and metering point.
          operationId: GetHourlyElectricityConsumption
          parameters:
            - name: x-customerId
              in: header
              description: ""
              required: true
              schema:
                type: integer
                format: int64
            - name: meteringPointId
              in: query
              description: ""
              required: true
              schema:
                type: string
            - name: fromDate
              in: query
              description: "Format ISO-8601: YYYY-MM-DD"
              required: true
              schema:
                type: string
            - name: toDate
              in: query
              description: "Format ISO-8601: YYYY-MM-DD"
              required: true
              schema:
                type: string
          responses:
            "200":
              description: OK
              content:
                application/json:
                  schema:
                    type: array
                    items:
                      $ref: "#/components/schemas/HourlyConsumptionModel"
      /api/consumption/electricity/peaks:
        get:
          tags:
            - Consumption
          summary: Get electricity consumption peaks
          description: "Get electricity consumption peaks for a customer and metering
            point.\r

            Will always return hourly consumption for full months, regardless of
            resolution (alignes with \"capacity tier\" and \"consumption map\"
            functionality)."
          operationId: GetElectricityPeaksConsumption
          parameters:
            - name: x-customerId
              in: header
              description: ""
              required: true
              schema:
                type: integer
                format: int64
            - name: meteringPointId
              in: query
              description: ""
              required: true
              schema:
                type: string
            - name: fromDate
              in: query
              description: "Format ISO-8601: YYYY-MM-DD"
              required: true
              schema:
                type: string
            - name: toDate
              in: query
              description: "Format ISO-8601: YYYY-MM-DD"
              required: true
              schema:
                type: string
            - name: resolution
              in: query
              description: "Supported resolutions: HOURLY, DAILY, WEEKLY"
              required: true
