spec:
  contents:
    openapi: 3.0.4
    info:
      title: Lyse.MyB2B.UserManagement
      version: "1.0"
    paths:
      /api/support/account:
        get:
          tags:
            - Support
          summary: Get ForgeRock user account details for a specific username. For
            internal use only, not related to Moment or any other BSS.
          operationId: GetByUsername
          parameters:
            - name: username
              in: query
              description: ForgeRock username (e-mail).
              required: true
              schema:
                type: string
          responses:
            "200":
              description: OK
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ForgeRockAccount"
      /api/support/manualsync:
        post:
          tags:
            - Support
          summary: Synchronizes primary user based on the current contact person in
            Moment.
          operationId: SynchronizePrimaryUser
          requestBody:
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/SynchronizePrimaryUserCommand"
              text/json:
                schema:
                  $ref: "#/components/schemas/SynchronizePrimaryUserCommand"
              application/*+json:
                schema:
                  $ref: "#/components/schemas/SynchronizePrimaryUserCommand"
            required: true
          responses:
            "200":
              description: OK
      /api/user/moment/list:
        get:
          tags:
            - User
          summary: Get list of user accounts with access to a specific Moment customer.
          operationId: GetList
          parameters:
            - name: x-momentId
              in: header
              description: Moment customer id.
              required: true
              schema:
                type: integer
                format: int64
          responses:
            "200":
              description: OK
              content:
                application/json:
                  schema:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserAccountModel"
      /api/user/moment/create:
        post:
          tags:
            - User
          summary: Create a new user account with access to a specific Moment customer.
          description: "Note: users already existing in ForgeRock will be upserted with
            access to new customer."
          operationId: Create
          parameters:
            - name: x-momentId
              in: header
              description: Moment customer id.
              required: true
              schema:
                type: integer
                format: int64
          requestBody:
            description: User account details.
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/UpsertUserPayload"
              text/json:
                schema:
                  $ref: "#/components/schemas/UpsertUserPayload"
              application/*+json:
                schema:
                  $ref: "#/components/schemas/UpsertUserPayload"
            required: true
          responses:
            "200":
              description: OK
      /api/user/moment/update/mobile:
        put:
          tags:
            - User
          summary: Update an existing user account with a new mobile number.
          operationId: UpdateMobile
          parameters:
            - name: x-momentId
              in: header
              description: Moment customer id.
              required: true
              schema:
                type: integer
                format: int64
          requestBody:
            description: User account details, including previous and new mobile number.
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/UpsertUserWithMobileChangePayload"
              text/json:
                schema:
                  $ref: "#/components/schemas/UpsertUserWithMobileChangePayload"
              application/*+json:
                schema:
                  $ref: "#/components/schemas/UpsertUserWithMobileChangePayload"
            required: true
          responses:
            "200":
              description: OK
      /api/user/moment/delete:
        delete:
          tags:
            - User
          summary: Delete a user account (remove claims) with access to a specific Moment
            customer.
          description: "Note: 'delete' in this context means to remove the relevant Moment
            claim from a user account in ForgeRock."
          operationId: Delete
          parameters:
            - name: x-momentId
              in: header
              description: Moment customer id.
              required: true
              schema:
                type: integer
                format: int64
          requestBody:
            description: Details for the user account to remove.
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/DeleteUserPayload"
              text/json:
                schema:
                  $ref: "#/components/schemas/DeleteUserPayload"
              application/*+json:
                schema:
                  $ref: "#/components/schemas/DeleteUserPayload"
            required: true
          responses:
            "200":
              description: OK
    components:
      schemas:
        DeleteUserPayload:
          required:
            - customerName
            - email
            - role
          type: object
          properties:
            customerName:
              type: string
              nullable: true
            email:
              type: string
              nullable: true
            role:
              type: string
              nullable: true
          additionalProperties: false
        ForgeRockAccount:
          required:
            - email
            - firstName
            - id
            - lastName
            - mobile
            - userName
          type: object
          properties:
            id:
              type: string
              nullable: true
            userName:
              type: string
              nullable: true
            lastName:
              type: string
              nullable: true
            firstName:
              type: string
              nullable: true
            email:
              type: string
              nullable: true
            mobile:
              type: string
              nullable: true
            lastUpdated:
              type: string
              format: date-time
              nullable: true
            created:
              type: string
              format: date-time
              nullable: true
            type:
              type: string
              nullable: true
            accountStatus:
              type: string
              nullable: true
            systems:
              type: array
              items:
                $ref: "#/components/schemas/ForgeRockAccountSystem"
              nullable: true
          additionalProperties: false
        ForgeRockAccountSystem:
          required:
            - system
          type: object
          properties:
            system:
              type: string
              nullable: true
            claims:
              type: array
              items:
                $ref: "#/components/schemas/ForgeRockClaim"
              nullable: true
          additionalProperties: false
        ForgeRockClaim:
          required:
            - crmUserId
            - customerRelationship
            - role
            - tenantId
          type: object
          properties:
            tenantId:
              type: string
              nullable: true
            role:
              type: string
              nullable: true
            crmUserId:
              type: string
              nullable: true
            customerRelationship:
              type: string
              nullable: true
          additionalProperties: false
        SynchronizePrimaryUserCommand:
          type: object
          properties:
            customerId:
              type: string
              nullable: true
          additionalProperties: false
        UpsertUserPayload:
          required:
            - customerName
            - email
            - firstName
            - lastName
            - mobile
            - role
          type: object
          properties:
            customerName:
              type: string
              nullable: true
            firstName:
              type: string
              nullable: true
            lastName:
              type: string
              nullable: true
            email:
              type: string
              nullable: true
            mobile:
              type: string
              nullable: true
            role:
              type: string
              nullable: true
          additionalProperties: false
        UpsertUserWithMobileChangePayload:
          required:
            - customerName
            - email
            - firstName
            - lastName
            - mobile
            - previousMobile
            - role
          type: object
          properties:
            customerName:
              type: string
              nullable: true
            firstName:
              type: string
              nullable: true
            lastName:
              type: string
              nullable: true
            email:
              type: string
              nullable: true
            mobile:
              type: string
              nullable: true
            role:
              type: string
              nullable: true
            previousMobile:
              type: string
              nullable: true
          additionalProperties: false
        UserAccountModel:
          required:
            - email
            - firstName
            - id
            - lastName
            - mobile
            - role
          type: object
          properties:
            id:
              type: string
              nullable: true
            email:
              type: string
              nullable: true
            firstName:
              type: string
              nullable: true
            lastName:
              type: string
              nullable: true
            mobile:
              type: string
              nullable: true
            role:
              type: string
              nullable: true
          additionalProperties: false
      securitySchemes:
        Bearer:
          type: http
          description: Please enter token
          scheme: Bearer
          bearerFormat: JWT
  meta:
    id: spc_e718fb471e314bba855c6aaa51635b0b
    created: 1781614382099
    modified: 1781614382100
