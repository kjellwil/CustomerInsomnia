spec:
  contents:
    openapi: 3.0.4
    info:
      title: LES.Aurora.Backend
      version: "1.0"
    paths:
      /api/company/list:
        get:
          tags:
            - Company
          summary: Get companies
          description: Get all companies.
          operationId: GetCompanies
          responses:
            "200":
              description: OK
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/CompaniesModel"
      /api/company:
        get:
          tags:
            - Company
          summary: Get company
          description: Get company by internal or external id
          operationId: GetCompanyByExternalId
          parameters:
            - name: companyId
              in: query
              description: Internal (Aurora) id of the company
              schema:
                type: integer
                format: int32
            - name: externalId
              in: query
              description: External id of the company
              schema:
                type: integer
                format: int32
          responses:
            "200":
              description: OK
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/CompanyModel"
            "404":
              description: Not Found
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorModel"
      /api/trades:
        get:
          tags:
            - Trades
          summary: Get trades
          description: Get trades by query parameters.
          operationId: QueryTrades
          parameters:
            - name: companyId
              in: query
              description: Aurora company id
              schema:
                type: integer
                format: int32
            - name: schema
              in: query
              description: "Trades schema (e.g: PowerForward)"
              schema:
                type: string
          responses:
            "200":
              description: OK
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/TradesModel"
            "404":
              description: Not Found
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorModel"
    components:
      schemas:
        CompaniesModel:
          type: object
          properties:
            companies:
              type: array
              items:
                $ref: "#/components/schemas/CompanyListModel"
              nullable: true
          additionalProperties: false
        CompanyListModel:
          type: object
          properties:
            id:
              type: integer
              format: int32
            name:
              type: string
              nullable: true
            externalId:
              type: string
              nullable: true
            companyType:
              type: string
              nullable: true
            organizationNumber:
              type: string
              nullable: true
            status:
              type: string
              nullable: true
          additionalProperties: false
        CompanyModel:
          type: object
          properties:
